<div class="box"><div id="page-home"><input id="search" class="input" placeholder="🔍 Tafuta Boda, Football, Wamama..." oninput="render()"><div id="chamaList"></div></div>

<p id="dMeta" style="color:#888;font-size:12px"></p><div class="progress"><div id="dFill" class="fill"></div></div><p id="dProgress" style="font-size:12px;color:#888"></p>

<script>
let user=JSON.parse(localStorage.getItem('cy_user')||'null');
let chamas=JSON.parse(localStorage.getItem('cy_chamas')||'null') || [
{id:1,name:'Vijana 20 Football Umoja',goal:'Jersey na Ball',target:40000,collected:12000,members:20,chair:'Coach Kevo',phone:'0794147629',list:[{n:'Coach Kevo',p:'0794147629',paid:2000},{n:'Brayo',p:'0711',paid:1000}],chats:[{u:'System',t:'Karibu kwa Vijana 20 Football! Pochi ni 0794147629',sys:true},{u:'Coach Kevo',t:'Wasee kesho mazoezi 6am'}]},
{id:2,name:'Boda Boda Umoja Innercore',goal:'Mbuzi Dec',target:50000,collected:32500,members:20,chair:'Collins',phone:'0794147629',list:[{n:'Collins',p:'0794147629',paid:3000}],chats:[{u:'System',t:'Chama imeundwa. Chat hapa',sys:true}]},
{id:3,name:'Wamama wa Chipo Kayole',goal:'Fridge',target:50000,collected:20000,members:15,chair:'Mama Njeri',phone:'0794147629',list:[{n:'Mama Njeri',p:'0794147629',paid:2500}],chats:[]}
];
let myChamas=JSON.parse(localStorage.getItem('cy_my')||'[]'); let activeId=null; let tab='pesa';
function save(){localStorage.setItem('cy_chamas',JSON.stringify(chamas));localStorage.setItem('cy_my',JSON.stringify(myChamas));localStorage.setItem('cy_user',JSON.stringify(user)); render();}
function toggleMenu(){document.getElementById('drawer').classList.toggle('open')} function go(p){document.querySelectorAll('[id^=page-]').forEach(e=>e.style.display='none');document.getElementById('page-'+p).style.display='block';toggleMenu();render();}
function render(){
let q=(document.getElementById('search')?.value||'').toLowerCase();
let list=q?chamas.filter(c=>(c.name+c.goal).toLowerCase().includes(q)):chamas;
let html=''; list.forEach(c=>{let pct=Math.round(c.collected/c.target*100); html+=`<div class="card" onclick="openDetail(${c.id})"><b>${c.name}</b><span class="badge">${pct}% • ${c.members} members</span><br><small style="color:#888">${c.goal} • Online: ${c.list.length}</small><div class="progress"><div class="fill" style="width:${pct}%"></div></div><small>KSH ${c.collected.toLocaleString()}</small><div style="display:flex;gap:6px;margin-top:6px"><button class="btn2" style="flex:1;padding:8px;border-radius:8px;background:#1a1a1a;border:1px solid #333;color:#fff">💬 Chat</button><button class="btn2" style="flex:1;padding:8px;border-radius:8px;background:#1a1a1a;border:1px solid #333;color:#fff">💰 Pochi 0794147629</button></div></div>`});
document.getElementById('chamaList').innerHTML=html;
let my=chamas.filter(c=>myChamas.includes(c.id)); document.getElementById('myList').innerHTML=my.map(c=>`<div class="card"><b>${c.name}</b><br><button class="btn btn2" onclick="openDetail(${c.id})">Fungua Chat & Pesa</button></div>`).join('')||'<div class="card">Bado huja-join</div>';
}
function openDetail(id){activeId=id; let c=chamas.find(x=>x.id===id); document.getElementById('dName').innerText=c.name; document.getElementById('dMeta').innerText=`${c.members} Members • ${c.goal} • Pochi 0794147629`; document.getElementById('dFill').style.width=Math.round(c.collected/c.target*100)+'%'; document.getElementById('dProgress').innerText=`KSH ${c.collected.toLocaleString()} / ${c.target.toLocaleString()}`; renderMembers(); renderChat(); switchTab('pesa'); document.getElementById('detailModal').classList.add('open');}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
function switchTab(t){tab=t; document.getElementById('tabPesa').classList.toggle('active',t==='pesa'); document.getElementById('tabChat').classList.toggle('active',t==='chat'); document.getElementById('viewPesa').style.display=t==='pesa'?'block':'none'; document.getElementById('viewChat').style.display=t==='chat'?'block':'none'; if(t==='chat'){setTimeout(()=>{let b=document.getElementById('chatBox'); b.scrollTop=b.scrollHeight},100)}}
function renderMembers(){let c=chamas.find(x=>x.id===activeId); let h=`<h4 style="margin:10px 0">Watu ${c.list.length}/${c.members} - Online</h4>`; c.list.forEach(m=>{h+=`<div class="member"><div>🟢 ${m.n}<br><small style="color:#888">${m.p}</small></div><small style="color:${m.paid?'#00d084':'#ff5555'}">${m.paid?'KSH '+m.paid:'Bado'}</small></div>`}); document.getElementById('dMembers').innerHTML=h;}
function renderChat(){let c=chamas.find(x=>x.id===activeId); let box=document.getElementById('chatBox'); box.innerHTML=c.chats.map(m=> m.sys ? `<div class="msg sys">${m.t}</div>` : `<div class="msg ${user&&m.u===user.name?'me':'other'}"><b>${m.u}</b><br>${m.t}</div>`).join('');}
function sendMsg(){if(!user){openAuth();return;} let txt=document.getElementById('chatInput').value; if(!txt) return; let c=chamas.find(x=>x.id===activeId); c.chats.push({u:user.name,t:txt}); document.getElementById('chatInput').value=''; save(); renderChat(); let box=document.getElementById('chatBox'); box.scrollTop=box.scrollHeight;}
function joinChama(){if(!user){openAuth();return;} let c=chamas.find(x=>x.id===activeId); if(!myChamas.includes(activeId)) myChamas.push(activeId); c.collected+=500; if(!c.list.find(x=>x.n===user.name)) c.list.push({n:user.name,p:user.phone,paid:500}); else c.list.find(x=>x.n===user.name).paid+=500; c.chats.push({u:'System',t:`${user.name} ametuma KSH 500 kwa Pochi 0794147629. Total sasa KSH ${c.collected}`,sys:true}); save(); renderMembers(); renderChat(); alert('Umetuma 500 kwa Pochi 0794147629. Imeingia kwenye chat!'); window.open(`https://wa.me/254180653168?text=Nimelipa%20500%20Pochi%200794147629%20kwa%20${encodeURIComponent(c.name)}`,'_blank');}
function transfer(){let to=prompt('Tuma kwa nani? Andika jina'); let amt=prompt('KSH ngapi?'); if(!to||!amt) return; let c=chamas.find(x=>x.id===activeId); c.chats.push({u:'System',t:`TRANSFER: ${user?user.name:'Member'} ametuma KSH ${amt} kwa ${to} kupitia App`,sys:true}); save(); renderChat(); alert(`Umetuma KSH ${amt} kwa ${to} - itaonekana kwa chat`);}
function createChama(){let n=document.getElementById('cName').value,g=document.getElementById('cGoal').value,a=parseInt(document.getElementById('cAmount').value); if(!n) return alert('Jaza jina'); let id=Date.now(); chamas.unshift({id,name:n,goal:g,target:(a||500)*20,collected:0,members:20,chair:user?user.name:'You',phone:'0794147629',list:user?[{n:user.name,p:user.phone,paid:0}]:[],chats:[{u:'System',t:`Chama ${n} imeundwa! Watu 20 wanaweza ku-chat hapa. Pochi ni 0794147629`,sys:true}]}); myChamas.push(id); save(); go('my');}
function openAuth(){document.getElementById('authModal').classList.add('open')} function login(){let name=document.getElementById('aName').value,phone=document.getElementById('aPhone').value; if(!name||!phone) return alert('Jaza'); user={name,phone}; save(); document.getElementById('authModal').classList.remove('open');}
render();
</script></body></html>
